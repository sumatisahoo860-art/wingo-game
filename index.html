<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Wingo Coins Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .timer-box { font-size: 24px; font-weight: bold; color: #ff5722; margin: 15px 0; }
        .balance-box { font-size: 18px; background: #e3f2fd; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        .btn { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; margin: 5px; }
        .btn-green { background: #4caf50; }
        .btn-red { background: #f44336; }
        .btn-violet { background: #9c27b0; }
        .history-list { text-align: left; background: #eee; padding: 10px; border-radius: 6px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎮 Wingo Virtual Coin Game</h2>
    
    <div class="balance-box">
        🪙 Your Wallet Balance: <span id="balance">10,000</span> Coins
    </div>

    <div>Period ID: <span id="period-id">20260901001</span></div>
    <div class="timer-box">⏱️ Time Remaining: <span id="countdown">30</span>s</div>

    <h3>Place Your Bet:</h3>
    <input type="number" id="bet-amount" value="100" min="10" style="padding: 10px; width: 80%; text-align: center; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;"><br>
    
    <button class="btn btn-green" onclick="placeBet('green')">Green</button>
    <button class="btn btn-violet" onclick="placeBet('violet')">Violet</button>
    <button class="btn btn-red" onclick="placeBet('red')">Red</button>

    <div class="history-list">
        <strong>📜 Last Game Results:</strong>
        <div id="game-history">No games played yet.</div>
    </div>
</div>

<script>
    // Frontend demo functions simulating API interactivity
    let balance = 10000;
    let timer = 30;
    let period = 20260901001;
    let historyData = [];

    // Basic countdown system loop
    setInterval(() => {
        if (timer > 0) {
            timer--;
            document.getElementById('countdown').innerText = timer;
        } else {
            // New Round starts
            timer = 30;
            period++;
            document.getElementById('period-id').innerText = period;
            
            // Random output simulated on front-end for visual feedback
            let colors = ['green', 'red', 'violet'];
            let winColor = colors[Math.floor(Math.random() * colors.length)];
            historyData.push(`Period ${period-1}: ${winColor.toUpperCase()}`);
            
            document.getElementById('game-history').innerHTML = historyData.slice(-5).reverse().join('<br>');
            alert(`Round Ended! Winning Color is: ${winColor.toUpperCase()}`);
        }
    }, 1000);

    function placeBet(color) {
        let amt = parseInt(document.getElementById('bet-amount').value);
        if (amt > balance) {
            alert("Insufficient coins!");
            return;
        }
        balance -= amt;
        document.getElementById('balance').innerText = balance;
        alert(`Bet placed successfully on ${color.toUpperCase()} for ${amt} virtual coins!`);
    }
</script>
</body>
</html>
